<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Baristiq"><title>Baristiq Studio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6f1;--fg:#2a1d14;--card:#fff;--mut:#7a6a5d;--ac:#8a4b1f;--acf:#fff;--bd:#e4d9cd;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--fg:#f1e7dc;--card:#2a201a;--mut:#a89888;--ac:#d9904f;--acf:#1c1511;--bd:#40322a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1511;--fg:#f1e7dc;--card:#2a201a;--mut:#a89888;--ac:#d9904f;--acf:#1c1511;--bd:#40322a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:70px}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.m{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 0}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 12px}
button.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:0 0 auto;min-width:88px;white-space:nowrap;border:0;border-radius:0;padding:12px 8px;background:none;font-size:12px}
nav button.on{color:var(--ac);font-weight:600}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(110px + env(safe-area-inset-bottom,0px))}
#ov .c{max-width:520px;margin:20px auto}
.k{font-size:20px;font-weight:600;color:var(--ac)}
textarea{min-height:90px}.filelabel{font-size:16px;color:var(--fg);font-weight:600;margin-top:12px}.filelabel input[type=file]{display:block;font-size:16px;padding:12px;margin-top:6px;min-height:48px;width:100%}.filelabel input[type=file]::file-selector-button{font:inherit;font-size:18px;font-weight:600;padding:9px 14px;margin-right:12px;cursor:pointer}.data-actions [data-a="exp"]{margin-left:18px}
#version{position:fixed;top:4px;right:7px;z-index:20;padding:2px 6px;border-radius:6px;background:var(--bg);color:var(--mut);font-size:10px;line-height:1.3;opacity:.85;pointer-events:none}
</style></head><body><main id="app"></main><div id="ov" hidden></div>
<div id="version">TEST · 2026.11.20 · 02</div><nav id="nav"></nav>
<script>
const K='espresso-v1',EQ=['machines','portafilters','baskets','grinders','scales','brewers'];
const T={
machines:{t:'Espressomaschinen',s:'Espressomaschine',f:[['name','Name/Modell','text'],['bar','Max. Druck (bar)','number'],['tmin','Brühtemperatur min (°C)','number'],['tmax','Brühtemperatur max (°C)','number'],['tstep','Schrittweite (°C), z. B. 0,5 oder 1','number'],['tlist','Oder feste Stufen (°C), getrennt durch Leerzeichen, z. B. 90 92 94','text'],['note','Notiz','text']]},
portafilters:{t:'Siebträger',s:'Siebträger',f:[['name','Name','text'],['dia','Durchmesser (mm)','number'],['note','Notiz','text']]},
baskets:{t:'Siebeinsätze',s:'Siebeinsatz',f:[['name','Name','text'],['dia','Durchmesser (mm)','number'],['dose','Füllmenge (g)','number'],['type','Typ','select',['Single','Double','Triple','Präzision','Sonstige']]]},
grinders:{t:'Mühlen',s:'Mühle',f:[['name','Name/Modell','text'],['turns','Umdrehungen (X), z. B. 3','number'],['steps','Schritte je Umdrehung (Y), z. B. 10','number'],['subs','Unterschritte je Schritt (Z), z. B. 10','number'],['mm','Weite je Unterschritt (mm), z. B. 0,015','number'],['zero','Mahlweite bei 0.0.0 (mm), optional','number'],['note','Notiz','text']]},
scales:{t:'Waagen',s:'Waage',f:[['name','Name/Modell','text'],['res','Auflösung (g)','number']]},
brewers:{t:'Zubereitungsgeräte',s:'Zubereitungsgerät',f:[['type','Geräteart','select',['Handfilter','French Press','AeroPress','Mokkakanne','Sonstiges']],['name','Name/Modell','text'],['capacity','Fassungsvermögen (ml)','number'],['note','Notiz','text']]},
beans:{t:'Bohnen',s:'Bohne',f:[['name','Name/Sorte','text'],['roaster','Röster','text'],['roastDate','Röstdatum','date'],['roast','Röstgrad','select',['Hell','Mittel','Dunkel']],['ara','Arabica-Anteil (%)','number'],['ratio','Ziel-Ratio (1 : x), z. B. 2','number'],['note','Herkunft/Notiz','text']]}
};
let db={};try{db=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
[...EQ,'beans','shots','preps','recipes'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.last=db.last&&typeof db.last==='object'?db.last:{};
const save=()=>{db.mod=Date.now();try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=1)=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:d});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const currentTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function lbl(k,o){if(!o)return'–';let s=o.name||'?';
 if(k=='beans'){const b=[o.roast,o.ara!==''&&o.ara!=null?`${nf(o.ara,0)} % Arabica / ${nf(100-o.ara,0)} % Robusta`:''].filter(Boolean);return s+(b.length?` (${b.join(', ')})`:'')}
 if(o.dia)s+=` ${nf(o.dia)} mm`;if(k=='baskets'&&o.dose)s+=` / ${nf(o.dose)} g`;return s}
const find=(k,id)=>db[k].find(o=>o.id==id);
const tl=o=>(o.tlist||'').split(/[;\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>!isNaN(x));
const hasR=o=>o.tmin!==''&&o.tmin!=null&&o.tmax!==''&&o.tmax!=null;
const tinfo=o=>{const L=tl(o);return L.length?`<div class="m">Temperaturstufen: ${L.join(' / ')} °C</div>`:hasR(o)?`<div class="m">${nf(o.tmin)} bis ${nf(o.tmax)} °C in ${nf(o.tstep||1,2)}-°C-Schritten (${Math.floor((o.tmax-o.tmin)/(o.tstep||1))+1} Stufen)</div>`:''};
let v='brew',edit=null,filt='',ftype='',delArm=null,xk='temp',prepNew=false,prepEdit=null;

function nav(){document.getElementById('nav').innerHTML=[['brew','Zubereiten'],['rec','Rezepte'],['shots','Extraktionen'],['beans','Bohnen'],['eq','Equipment'],['ana','Auswertung'],['data','Daten']].map(([a,b])=>`<button data-a="tab" data-v="${a}" class="${v==a?'on':''}">${b}</button>`).join('')}

function entList(k,showTitle=true,filterType=null){const x=T[k],items=filterType?db[k].filter(o=>o.type===filterType):db[k];return (showTitle?`<h2>${x.t}<button data-a="add" data-k="${k}">+ Neu</button></h2>`:`<h3>${x.t}<button data-a="add" data-k="${k}"${filterType?` data-type="${filterType}"`:''}>+ Neu</button></h3>`)+
 (items.length?items.map(o=>`<div class="c"><b>${esc(lbl(k,o))}</b>${o.note?`<div class="m">${esc(o.note)}</div>`:''}${o.bar?`<div class="m">${nf(o.bar)} bar</div>`:''}${k=='machines'?tinfo(o):''}${k=='beans'&&o.roastDate?`<div class="m">Röstdatum: ${esc(o.roastDate)} · ${Math.max(0,Math.floor((new Date(today())-new Date(o.roastDate))/864e5))} Tage seit Röstung</div>`:''}${k=='brewers'&&o.type?`<div class="m">${esc(o.type)}${o.capacity?' · '+esc(o.capacity)+' ml':''}</div>`:''}${k=='grinders'&&gcal(o)?(c=>`<div class='m'>${c.T} × ${c.S} × ${c.U} = ${c.max} Stufen à ${nf(c.m,3)} mm (0 bis ${nf(c.z+c.max*c.m,3)} mm)</div>`)(gcal(o)):''}${o.roaster?`<div class="m">${esc(o.roaster)}</div>`:''}${o.ratio?`<div class="m">Ziel-Ratio 1 : ${nf(o.ratio,2)}</div>`:''}
 <div class="row"><button data-a="edit" data-k="${k}" data-id="${o.id}">Bearbeiten</button><button data-a="del" data-k="${k}" data-id="${o.id}">${delArm==o.id?'Sicher löschen?':'Löschen'}</button></div></div>`).join(''):`<div class="m">Noch keine ${x.t}.</div>`)}

function entForm(k,id,presetType=''){const x=T[k],o=id?find(k,id):{};
 document.getElementById('ov').hidden=false;
 document.getElementById('ov').innerHTML=`<form class="c" id="ef" data-k="${k}" data-id="${id||''}"><b>${x.s} ${id?'bearbeiten':'hinzufügen'}</b>`+x.f.map(([n,l,t,opt])=>t=='select'?`<label>${l}<select name="${n}">${opt.map(p=>`<option${o[n]==p||(!id&&n==='type'&&presetType===p)?' selected':''}>${p}</option>`).join('')}</select></label>`:`<label>${l}<input name="${n}" type="${t}" ${t=='number'?'step="any" inputmode="decimal"':''} value="${esc(o[n])}"></label>`).join('')+
 (k=='beans'?'<div class="m" id="rb"></div>':'')+`<div class="row"><button class="p" type="submit">Speichern</button><button type="button" data-a="close">Abbrechen</button></div></form>`;
 if(k=='beans'){const f=document.getElementById('ef'),u=()=>{const a=f.ara.value;document.getElementById('rb').textContent=a===''?'Leer lassen = unbekannt. 100 % = reine Arabica.':`Robusta-Anteil: ${nf(100-a,0)} %`};f.ara.oninput=u;u()}}

function shotForm(){const s=edit?find('shots',edit):{...db.last,date:today(),method:'Espresso',rate:7,bal:0};
 const sel=k=>`<label>${T[k].s}<select name="${k}"><option value="">–</option>${db[k].map(o=>`<option value="${o.id}"${o.id==s[k]?' selected':''}>${esc(lbl(k,o))}${k==='beans'&&o.roastDate?' · Röstung '+esc(o.roastDate):''}</option>`).join('')}</select></label>`;
 const n=(nm,l,ex='')=>`<label>${l}<input name="${nm}" type="number" step="any" inputmode="decimal" value="${esc(s[nm])}" ${ex}></label>`;
 const brewerType=(s.method||'').startsWith('AeroPress')?'AeroPress':(s.method||'Handfilter');
 const brewerList=db.brewers.filter(o=>o.type===brewerType||o.type==='Sonstiges');
 return `<h1>${edit?'Extraktion bearbeiten':'Neue Extraktion'}</h1><form id="sf" class="c">
 <label>Datum<input name="date" type="date" value="${s.date||today()}"></label>
 <label>Zubereitungsart<select name="method" id="em">${methodOptions(s.method||'Espresso')}</select></label>
 ${sel('beans')}<div class="m" id="beanRoastInfo"></div>
 <div id="espressoEquipment" class="g">${sel('machines')}${sel('portafilters')}${sel('baskets')}</div>
 <div id="brewerEquipment" class="g"><label>Zubereitungsgerät<select name="brewers"><option value="">–</option>${brewerList.map(o=>`<option value="${o.id}"${o.id==s.brewers?' selected':''}>${esc(lbl('brewers',o))}</option>`).join('')}</select></label><label id="filterTypeField">Filtertyp<select name="filterType"><option value="">–</option>${['Papier','Metall','Stoff','Ohne Filter','Sonstiger'].map(x=>`<option${s.filterType==x?' selected':''}>${x}</option>`).join('')}</select></label></div>
 <div class="g">${sel('grinders')}${sel('scales')}</div>
 <div class='c'><b>Ratio-Planer</b><div class='g'><label>Ziel-Ratio (1 : x)<input name='tratio' type='number' step='any' inputmode='decimal' value='${esc(s.tratio)}'></label><label>Zielmenge (g/ml)<input name='tout' type='number' step='any' inputmode='decimal' value='${esc(s.tout)}'></label></div><div id='pr'></div></div>
 <div class="g"><div id='gw' style='grid-column:1/-1' data-v='${esc(s.grind)}' data-m='${esc(s.gmm)}'></div><div id="tw" data-v="${esc(s.temp)}"></div>${n('dose','Kaffeemenge (g)')}${n('yield','Getränkemenge / Ausbeute (g/ml)')}${n('time','Zeit (s)')}<div id="waterField">${n('water','Eingesetztes Wasser (ml)')}</div><div id="pressureField">${n('bar','Druck (bar)')}</div></div>
 <div class="c" id="calc"></div>
 <label>Gesamtbewertung: <b id="rv">${s.rate??7}</b> / 10<input name="rate" type="range" min="1" max="10" value="${s.rate??7}"></label>
 <label>Balance: <b id="bv"></b><input name="bal" type="range" min="-5" max="5" value="${s.bal??0}"></label>
 <label>Geschmacksnotizen<textarea name="note">${esc(s.note)}</textarea></label>
 <div class="row"><button class="p" type="submit">Speichern</button>${edit?'<button type="button" data-a="tab" data-v="shots">Abbrechen</button>':''}</div></form>`}
function deviceUI(){const f=document.getElementById('sf');if(!f)return;const method=f.querySelector('[name="method"]').value,espresso=method==='Espresso',ew=document.getElementById('espressoEquipment'),bw=document.getElementById('brewerEquipment'),pw=document.getElementById('pressureField');ew.style.display=espresso?'grid':'none';bw.style.display=espresso?'none':'grid';pw.style.display=espresso?'block':'none';const ww=document.getElementById('waterField');ww.style.display=espresso?'none':'block';ww.querySelector('input').disabled=espresso;ew.querySelectorAll('select').forEach(x=>x.disabled=!espresso);pw.querySelectorAll('input').forEach(x=>x.disabled=!espresso);const type=method.startsWith('AeroPress')?'AeroPress':method,sel=f.querySelector('[name="brewers"]'),old=sel.value,list=db.brewers.filter(x=>x.type===type||x.type==='Sonstiges');sel.innerHTML='<option value="">–</option>'+list.map(x=>`<option value="${x.id}">${esc(lbl('brewers',x))}</option>`).join('');sel.value=list.some(x=>x.id===old)?old:'';sel.disabled=espresso;const ff=document.getElementById('filterTypeField');ff.style.display=(method==='Handfilter'||method.startsWith('AeroPress'))?'block':'none';ff.querySelector('select').disabled=espresso||ff.style.display==='none';}
function calc(){const f=document.getElementById('sf');if(!f)return;const g=n=>parseFloat(f.querySelector('[name="'+n+'"]').value),d=g('dose'),y=g('yield'),t=g('time'),method=f.querySelector('[name="method"]').value,water=g('water'),ratioAmount=method==='Espresso'?y:water,bean=find('beans',f.querySelector('[name="beans"]').value),rd=bean?.roastDate||'',days=rd?Math.round((new Date(f.querySelector('[name="date"]').value)-new Date(rd))/864e5):null;document.getElementById('beanRoastInfo').textContent=rd?`Röstdatum: ${rd} · ${days>=0?days+' Tage seit Röstung':'Röstdatum liegt in der Zukunft'}`:'Für diese Bohne ist noch kein Röstdatum hinterlegt.';document.getElementById('calc').innerHTML=`<div class='g'><div><div class='m'>Ratio</div><div class='k'>${d>0&&ratioAmount>0?'1 : '+nf(ratioAmount/d,2):'–'}</div></div><div><div class='m'>Durchfluss</div><div class='k'>${y>0&&t>0?nf(y/t,2)+' g/s':'–'}</div></div></div><div class='m'>${days!=null&&!isNaN(days)?'Tage nach Röstung: '+days:'Röstdatum wird aus der Bohnenverwaltung übernommen.'}</div>`;document.getElementById('rv').textContent=f.querySelector('[name="rate"]').value;const b=+f.querySelector('[name="bal"]').value;document.getElementById('bv').textContent=b==0?'ausgewogen':b<0?`sauer ${-b}`:`bitter ${b}`}
function shotCard(s){const d=+s.dose,y=+s.yield,t=+s.time,bean=find('beans',s.beans),rd=s.roastDate||bean?.roastDate,ratioAmount=(!s.method||s.method==='Espresso')?y:+s.water;const eq=EQ.map(k=>s[k]?lbl(k,find(k,s[k])||{name:s.snap?.[k]}):'').filter(Boolean).join(' · ');
 const b=+s.bal;return `<div class="c"><div class="m">${esc(s.date)} · ${esc(s.method||'Espresso')}</div><b>${esc(s.beans?lbl('beans',bean||{name:s.snap?.beans}):'Ohne Bohne')}</b> <span class="k" style="float:right">${s.rate}/10</span>
 <div>${d?nf(d)+' g':'?'} → ${y?nf(y)+' g/ml':'?'}${s.water?` · Wasser ${nf(s.water,0)} ml`:''}${t?' in '+nf(t,0)+' s':''}${d>0&&ratioAmount>0?' · 1:'+nf(ratioAmount/d,2):''}${y>0&&t>0?' · '+nf(y/t,2)+' g/s':''}</div>
 <div class="m">${s.grind?'Mahlgrad '+esc(s.grind)+(s.gmm?' ('+nf(s.gmm,3)+' mm)':'')+' · ':''}${s.temp?nf(s.temp)+' °C · ':''}${s.bar?nf(s.bar)+' bar · ':''}${b==0?'ausgewogen':b<0?'sauer '+(-b):'bitter '+b}</div>
 ${rd?`<div class="m">Röstdatum: ${esc(rd)}</div>`:''}${s.filterType?`<div class="m">Filter: ${esc(s.filterType)}</div>`:''}${eq?`<div class="m">${esc(eq)}</div>`:''}${s.note?`<div>${esc(s.note)}</div>`:''}
 <div class="row"><button data-a="sedit" data-id="${s.id}">Bearbeiten</button><button data-a="sdel" data-id="${s.id}">${delArm==s.id?'Sicher löschen?':'Löschen'}</button></div></div>`}

function tempUI(){const f=document.getElementById('sf'),w=document.getElementById('tw');if(!f||!w)return;const method=f.querySelector('[name="method"]').value,m=find('machines',f.querySelector('[name="machines"]').value)||{},c=f.temp?f.temp.value:w.dataset.v,L=tl(m);if(method!=='Espresso'){w.innerHTML=`<label>Temperatur (°C)<input name="temp" type="number" step="any" inputmode="decimal" value="${esc(c)}"></label>`;return}
 if(L.length){if(c!==''&&!L.includes(+c))L.push(+c);L.sort((a,b)=>a-b);w.innerHTML=`<label>Temperatur (°C)<select name="temp"><option value="">–</option>${L.map(x=>`<option${x==c?' selected':''}>${x}</option>`).join('')}</select></label>`}
 else if(hasR(m)){const st=m.tstep||1,mid=c!==''?c:m.tmin;w.innerHTML=`<label>Temperatur (°C)<input name="temp" type="number" inputmode="decimal" min="${m.tmin}" max="${m.tmax}" step="${st}" value="${esc(c)}"></label><input id="tr" type="range" min="${m.tmin}" max="${m.tmax}" step="${st}" value="${mid}">`}
 else w.innerHTML=`<label>Temperatur (°C)<input name="temp" type="number" step="any" inputmode="decimal" value="${esc(c)}"></label>`}
const nn=v=>v===''||v==null?NaN:+v;
const XP={temp:['Temperatur (°C)',s=>nn(s.temp)],ratio:['Ratio (Zielmenge/Dosis)',s=>(s.method||'Espresso')==='Espresso'?nn(s.yield)/nn(s.dose):nn(s.water)/nn(s.dose)],time:['Zeit (s)',s=>nn(s.time)],flow:['Durchfluss (g/s)',s=>nn(s.yield)/nn(s.time)],gmm:['Mahlweite (mm)',s=>nn(s.gmm)],dose:['Dosis (g)',s=>nn(s.dose)],age:['Tage nach Röstung',s=>(s.roastDate||(find('beans',s.beans)||{}).roastDate)?(new Date(s.date)-new Date(s.roastDate||(find('beans',s.beans)||{}).roastDate))/864e5:NaN],bal:['Balance (sauer − / bitter +)',s=>+s.bal]};
function ana(){const fx=XP[xk][1],P=db.shots.filter(s=>!filt||s.beans==filt).map(s=>({x:fx(s),y:+s.rate})).filter(p=>isFinite(p.x)&&isFinite(p.y)),n=P.length;
 let h=`<h1>Auswertung</h1><label>Bohne<select id='flt'><option value=''>Alle Bohnen</option>${db.beans.map(o=>`<option value='${o.id}'${filt==o.id?' selected':''}>${esc(lbl('beans',o))}</option>`).join('')}</select></label><label>X-Achse<select id='xs'>${Object.entries(XP).map(([k,[l]])=>`<option value='${k}'${k==xk?' selected':''}>${l}</option>`).join('')}</select></label>`;
 if(n<2)return h+`<div class='c m'>Zu wenige Extraktionen mit Wert für diesen Parameter (n = ${n}).</div>`;
 const xs=P.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs),mx=xs.reduce((a,b)=>a+b)/n,my=P.reduce((a,p)=>a+p.y,0)/n;
 let sxy=0,sxx=0,syy=0;P.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2});
 const r=sxx>0&&syy>0?sxy/Math.sqrt(sxx*syy):NaN,sl=sxx>0?sxy/sxx:NaN;
 const W=320,H=200,L=34,B=28,R=8,Tp=8,X=v=>L+(x1>x0?(v-x0)/(x1-x0):.5)*(W-L-R),Y=v=>Tp+(10-v)/9*(H-B-Tp),tx="style='fill:var(--mut);font-size:10px'";
