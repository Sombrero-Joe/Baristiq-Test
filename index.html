.k{font-size:20px;font-weight:600;color:var(--ac)}

#version{position:fixed;top:4px;right:7px;z-index:20;padding:2px 6px;border-radius:6px;background:var(--bg);color:var(--mut);font-size:10px;line-height:1.3;opacity:.85;pointer-events:none}

 '<div class="g">'+scale('sweetness','Süße')+scale('acidity','Säure')+scale('bitterness','Bitterkeit')+scale('body','Körper / Fülle')+duration()+'</div>'+

function prepSummary(p){
 const selected=p.taste||[],personal=selected.includes('lecker')&&selected.includes('ausgewogen')?'lecker und ausgewogen':selected.join(', ');
 const labels=[['fragrance','Duft'],['aroma','Aroma'],['flavor','Geschmack'],['aftertasteIntensity','Nachgeschmacksintensität'],['sweetness','Süße'],['acidity','Säure'],['bitterness','Bitterkeit'],['body','Körper'],['aftertaste','Nachgeschmacksdauer']];
 const intensity=['','sehr gering','gering','mittel','stark','sehr stark'];
 const duration=['','gering','eher gering','mittel','anhaltend','lang anhaltend'];
 const sensory=labels.filter(([k])=>p[k]).map(([k,l])=>l+' '+((k==='aftertaste'?duration:intensity)[+p[k]]||p[k]));
 const parts=(k,l)=>Array.isArray(p[k])&&p[k].length?l+' '+p[k].join(', '):'';
 [['aromaDescriptors','Duft-/Aromanoten'],['flavorDescriptors','Geschmacksnoten'],['mainTastes','Grundgeschmack'],['mouthfeelDescriptors','Mundgefühl']].forEach(([k,l])=>{const v=parts(k,l);if(v)sensory.push(v)});
 if(p.acidityType)sensory.push('Säurecharakter '+p.acidityType);
 if(p.balance)sensory.push('Balance '+(['','sehr unausgewogen','eher unausgewogen','ausgewogen','gut ausgewogen','sehr harmonisch'][+p.balance]||p.balance));
 const after=parts('aftertasteFeel','Mundgefühl nach dem Schlucken');if(after)sensory.push(after);
 if(!personal&&!sensory.length)return '';
 if(+p.bitterness>=4&&personal)return 'Sensorisch '+intensity[+p.bitterness]+' bitter, persönlich schmeckt mir der Kaffee aber '+personal+'.'+(sensory.length?' Weitere Beschreibung: '+sensory.join('; ')+'.':'');
 return [personal?'Persönlich: '+personal:'',sensory.length?'Sensorisch: '+sensory.join('; '):''].filter(Boolean).join(' · ')+'.';
}
